<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-en="Library quiz">Quiz de la biblioteca</title>
  <meta name="description" content="Diez preguntas sobre las máquinas que la NASA dejó en la Luna, Marte y el espacio profundo." data-en-content="Ten questions about the machines NASA left on the Moon, Mars and in deep space.">
  <meta name="theme-color" content="#0f1219">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..700&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="juegos.css">
  <script src="../js/i18n.js"></script>
</head>
<body>
  <div class="wrap quiz">
    <div class="top-row"><a class="back" href="./" data-en="Game room">Sala de juegos</a><span data-lang-switch></span></div>
    <h1 class="title" data-en-html="Library <em>quiz</em>">Quiz de la <em>biblioteca</em></h1>
    <p class="lede" data-en="Ten random questions about the books on the shelf. Answer with a click or with keys 1 to 4. After each answer we tell you the full story.">Diez preguntas al azar sobre los libros del estante. Responde con un clic o con las teclas 1 a 4. Después de cada respuesta te contamos el dato completo.</p>

    <div class="hud">
      <span class="stat"><span data-en="Question">Pregunta</span> <b id="num">1/10</b></span>
      <span class="stat"><span data-en="Correct">Aciertos</span> <b id="score">0</b></span>
      <span class="stat"><span data-en="Streak">Racha</span> <b id="streak">0</b></span>
    </div>

    <section class="paper q-card" id="card" aria-live="polite"></section>
  </div>
  <script src="quiz.js"></script>
</body>
</html>
